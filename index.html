<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 진동·충격 분석 시스템</title>

<style>
body{
    margin:0;
    background:#0b1020;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

header{
    padding:20px;
    background:#111827;
    font-size:1.4rem;
    font-weight:bold;
}

.container{
    padding:20px;
}

.card{
    background:#1f2937;
    border-radius:18px;
    padding:20px;
    margin:20px auto;
    max-width:550px;
}

.value{
    font-size:2.4rem;
    margin-top:15px;
    font-weight:bold;
}

.label{
    margin-top:10px;
    font-size:1.1rem;
}

canvas{
    background:#0f172a;
    border-radius:12px;
    margin-top:15px;
}

.small{
    color:#cbd5e1;
    font-size:0.9rem;
    margin-top:10px;
}
</style>
</head>

<body>

<header>
MEMS 센서 기반 실시간 진동·충격 분석 시스템
</header>

<div class="container">

    <div class="card">
        <h2>충격 강도</h2>
        <div class="value" id="impact">0.00</div>
        <div class="label" id="impactText">센서 연결 중...</div>
    </div>

    <div class="card">
        <h2>기울기 분석</h2>
        <div class="value" id="tilt">0°</div>
        <div class="label" id="tiltText">자세 분석 중...</div>
    </div>

    <div class="card">
        <h2>실시간 진동 그래프</h2>
        <canvas id="graph" width="500" height="200"></canvas>

        <div class="small">
            스마트폰을 흔들거나 기울여 보세요
        </div>
    </div>

</div>

<script>

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

let data = Array(50).fill(0);

function drawGraph(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.beginPath();

    for(let i=0;i<data.length;i++){

        let x = i * 10;
        let y = 180 - data[i] * 5;

        if(i===0){
            ctx.moveTo(x,y);
        }else{
            ctx.lineTo(x,y);
        }
    }

    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3;
    ctx.stroke();
}

function updateGraph(value){

    data.push(value);

    if(data.length > 50){
        data.shift();
    }

    drawGraph();
}

function activateSensors(){

    window.addEventListener("devicemotion", function(event){

        let ax = event.accelerationIncludingGravity.x || 0;
        let ay = event.accelerationIncludingGravity.y || 0;
        let az = event.accelerationIncludingGravity.z || 0;

        let total = Math.sqrt(ax*ax + ay*ay + az*az);

        document.getElementById("impact").innerText =
            total.toFixed(2);

        let text = "";

        if(total < 12){
            text = "안정 상태";
        }
        else if(total < 20){
            text = "약한 진동 감지";
        }
        else{
            text = "강한 충격 감지";
        }

        document.getElementById("impactText").innerText = text;

        updateGraph(total);

    });

    window.addEventListener("deviceorientation", function(event){

        let beta = event.beta || 0;

        document.getElementById("tilt").innerText =
            beta.toFixed(1) + "°";

        let posture = "";

        if(Math.abs(beta) < 20){
            posture = "균형 상태";
        }
        else if(Math.abs(beta) < 45){
            posture = "약간 기울어짐";
        }
        else{
            posture = "불안정 자세";
        }

        document.getElementById("tiltText").innerText = posture;

    });
}

async function startApp(){

    if(typeof DeviceMotionEvent !== 'undefined' &&
       typeof DeviceMotionEvent.requestPermission === 'function'){

        try{
            const permission =
                await DeviceMotionEvent.requestPermission();

            if(permission === 'granted'){
                activateSensors();
            }else{
                alert("센서 권한이 필요합니다.");
            }
        }catch(e){
            console.log(e);
        }

    }else{
        activateSensors();
    }
}

startApp();

</script>

</body>
</html>
